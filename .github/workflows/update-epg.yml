
name: Daily EPG Timezone Conversion

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 02:00
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  # 第一个 Job：下载、转换并上传 Pages Artifact
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download and convert EPG
        run: python convert_epg.py

      - name: Verify EPG output
        run: |
          set -e
          test -s _site/epg_CN_0800.xml.gz
          gzip -t _site/epg_CN_0800.xml.gz
          ls -lh _site/

      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site/
          retention-days: 1

  # 第二个 Job：等待 build 完成后部署
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
